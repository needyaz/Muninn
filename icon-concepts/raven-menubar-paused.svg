<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22" width="88" height="88">
  <!-- Menu bar icon - paused variant (raven with pause badge) -->

  <!-- Raven head - simple circle -->
  <circle cx="7" cy="7.5" r="4.5" fill="black"/>

  <!-- Raven body - oval -->
  <ellipse cx="6" cy="14" rx="5.5" ry="5" fill="black"/>

  <!-- Connect head to body -->
  <rect x="3" y="7" width="7" height="8" fill="black"/>

  <!-- Beak - thick triangular, pointing right -->
  <polygon points="11,6.5 17,7.5 11,9" fill="black"/>

  <!-- Tail feathers - pointed left -->
  <polygon points="0.5,15 -2,19.5 2,17 0,21 4,18 6,17" fill="black"/>

  <!-- Eye -->
  <circle cx="8.5" cy="6.8" r="1.2" fill="white"/>

  <!-- Paper snippet in beak -->
  <rect x="14.5" y="5.5" width="5" height="4" rx="0.5" fill="white" stroke="black" stroke-width="0.6" transform="rotate(-5, 17, 7.5)"/>
  <!-- Lines on paper -->
  <line x1="15.5" y1="7" x2="18.5" y2="7" stroke="black" stroke-width="0.5" stroke-linecap="round"/>
  <line x1="15.5" y1="8.2" x2="17.8" y2="8.2" stroke="black" stroke-width="0.5" stroke-linecap="round"/>

  <!-- Pause symbol - two vertical bars, bottom right -->
  <rect x="14.5" y="14.5" width="2" height="6" rx="0.4" fill="black"/>
  <rect x="17.5" y="14.5" width="2" height="6" rx="0.4" fill="black"/>
</svg>
