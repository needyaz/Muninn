<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22" width="220" height="220">
  <!--
    PAUSED state menu bar icon
    Same raven head as menu-A, plus a small pause badge in the bottom-right.
    The badge sits in the empty space below the beak — no overlap with the head.
    Badge: black circle, white pause bars (knockouts).
  -->

  <!-- Raven head (identical to menu-A) -->
  <path fill="black" d="
    M 7,3
    L 9.5,3.5
    C 11,4 12,5 12,6
    L 20,11
    L 20,12.5
    L 12,15
    C 11,18 9,20.5 8,21
    C 6,21 4,19.5 3.5,18
    C 2.5,16 2,14 2,12
    C 2,10 2,8.5 2,8
    C 2,6 3.5,4 5.5,3.5
    Z
  "/>

  <!-- Eye — white knockout -->
  <circle cx="8" cy="9.5" r="1.7" fill="white"/>

  <!-- Pause badge — black circle in bottom-right (empty space below beak) -->
  <circle cx="18" cy="18" r="3.8" fill="black"/>

  <!-- Pause bars — white knockouts inside badge -->
  <rect x="16.1" y="15.6" width="1.4" height="4.8" rx="0.3" fill="white"/>
  <rect x="18.5" y="15.6" width="1.4" height="4.8" rx="0.3" fill="white"/>
</svg>
