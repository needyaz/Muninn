<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22" width="44" height="44">
  <!-- Menu bar icon variant - monochrome silhouette at native size -->
  <!-- Designed for 22x22pt macOS menu bar (rendered at 2x here) -->

  <!-- Raven silhouette with paper in beak -->
  <g transform="translate(11, 12)" fill="black">
    <!-- Body -->
    <path d="
      M -5,3
      C -7,2 -8,-1 -7,-3.5
      C -6.2,-5.2 -4.5,-6.5 -2.5,-7
      C -1,-7.4 0.5,-7.3 1.8,-6.8
      C 3,-6.3 3.8,-5.4 4.2,-4.3
      C 4.4,-3.8 4.3,-3.2 4,-2.8
      L 3.5,-2.3
      C 4.2,-2.7 5,-3.2 5.5,-3.8
      L 7.5,-4.5
      C 7.2,-3.8 6.5,-3.2 5.8,-2.8
      L 5,-2.4
      C 4.5,-2.1 4,-1.6 3.5,-1
      C 3,0 2.2,1 1,1.8
      C -0.2,2.5 -2,3.2 -3.5,3.2
      Z
    "/>

    <!-- Tail -->
    <path d="
      M -5,3
      L -8,5.5
      L -7,4.8
      L -7.2,6
      L -6,4.8
      L -5.8,6.2
      L -5.2,4.2
      Z
    "/>

    <!-- Eye (knockout) -->
    <circle cx="3.2" cy="-3.6" r="0.9" fill="white"/>

    <!-- Paper in beak -->
    <rect x="6.8" y="-5.8" width="3" height="2.2" rx="0.3" fill="white" stroke="black" stroke-width="0.4" transform="rotate(-5, 8.3, -4.7)"/>
  </g>
</svg>
