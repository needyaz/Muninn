<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22" width="88" height="88">
  <!-- Menu bar icon v2 - much simpler, bolder raven profile -->

  <!-- Raven head - simple circle -->
  <circle cx="8" cy="7.5" r="4.5" fill="black"/>

  <!-- Raven body - oval -->
  <ellipse cx="7" cy="14" rx="5.5" ry="5" fill="black"/>

  <!-- Connect head to body -->
  <rect x="4" y="7" width="7" height="8" fill="black"/>

  <!-- Beak - thick triangular, pointing right -->
  <polygon points="12,6.5 18,7.5 12,9" fill="black"/>

  <!-- Tail feathers - pointed left -->
  <polygon points="1.5,15 -1,19.5 3,17 1,21 5,18 7,17" fill="black"/>

  <!-- Eye -->
  <circle cx="9.5" cy="6.8" r="1.2" fill="white"/>

  <!-- Paper snippet in beak -->
  <rect x="15.5" y="5.5" width="5" height="4" rx="0.5" fill="white" stroke="black" stroke-width="0.6"/>
  <!-- Lines on paper -->
  <line x1="16.5" y1="7" x2="19.5" y2="7" stroke="black" stroke-width="0.5" stroke-linecap="round"/>
  <line x1="16.5" y1="8.2" x2="18.8" y2="8.2" stroke="black" stroke-width="0.5" stroke-linecap="round"/>
</svg>
