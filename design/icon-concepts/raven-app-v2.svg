<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1c1c3a"/>
      <stop offset="100%" style="stop-color:#0e0e20"/>
    </linearGradient>
  </defs>

  <!-- macOS rounded square background -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bg)"/>

  <!-- Raven built from simple geometric shapes -->
  <g transform="translate(200, 230)">
    <!-- Body - large oval -->
    <ellipse cx="20" cy="60" rx="80" ry="70" fill="#2c2c4a"/>

    <!-- Connect head to body -->
    <rect x="20" y="-20" width="80" height="70" rx="10" fill="#2c2c4a"/>

    <!-- Head - circle -->
    <circle cx="75" cy="-15" r="55" fill="#2c2c4a"/>

    <!-- Wing detail - darker arc -->
    <ellipse cx="0" cy="55" rx="65" ry="50" fill="#1a1a32"/>

    <!-- Beak - bold wedge pointing right -->
    <polygon points="125,-25 195,-15 125,0" fill="#4a4a6e"/>

    <!-- Tail feathers -->
    <polygon points="-60,80 -100,140 -70,115 -85,155 -50,120 -40,150 -30,110 -15,95" fill="#2c2c4a"/>

    <!-- Eye - golden ring -->
    <circle cx="90" cy="-22" r="14" fill="#d4a843"/>
    <circle cx="92" cy="-24" r="6" fill="#0e0e20"/>
    <!-- Eye highlight -->
    <circle cx="95" cy="-27" r="2.5" fill="#f0d870" opacity="0.6"/>

    <!-- Paper snippet in beak -->
    <g transform="translate(170, -30) rotate(-5)">
      <rect x="0" y="0" width="65" height="50" rx="4" fill="#f5f0e5"/>
      <!-- Text lines -->
      <line x1="8" y1="14" x2="50" y2="14" stroke="#b8ad92" stroke-width="3" stroke-linecap="round"/>
      <line x1="8" y1="24" x2="42" y2="24" stroke="#b8ad92" stroke-width="3" stroke-linecap="round"/>
      <line x1="8" y1="34" x2="32" y2="34" stroke="#b8ad92" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>
</svg>
