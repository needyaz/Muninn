name: Muninn
options:
  bundleIdPrefix: blue.luci
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    # The one name the bundle IDs derive from. A copy of Muninn overrides it (and the team): see README.
    MUNINN_BUNDLE_ID: blue.luci.Muninn
    # Product/display name of the app; test builds override it with "Muninn Dev" (the module stays Muninn).
    MUNINN_PRODUCT_NAME: Muninn
# Third-party packages are pinned to the exact version that was reviewed; bump it on purpose.
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: 2.4.0
targets:
  Muninn:
    type: application
    platform: macOS
    sources:
      - path: Muninn
        excludes:
          - Info.plist
          - Muninn.entitlements
    dependencies:
      - package: KeyboardShortcuts
    info:
      path: Muninn/Info.plist
      properties:
        CFBundleName: $(PRODUCT_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.utilities
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Muninn/Muninn.entitlements
      properties:
        com.apple.security.files.bookmarks.app-scope: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MUNINN_BUNDLE_ID)
        PRODUCT_NAME: $(MUNINN_PRODUCT_NAME)
        PRODUCT_MODULE_NAME: Muninn
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        DEAD_CODE_STRIPPING: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Sandboxed, and no network, hardware or personal-data access. The only file access is a folder the user picks.
        ENABLE_APP_SANDBOX: YES
        ENABLE_INCOMING_NETWORK_CONNECTIONS: NO
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: NO
        ENABLE_RESOURCE_ACCESS_AUDIO_INPUT: NO
        ENABLE_RESOURCE_ACCESS_BLUETOOTH: NO
        ENABLE_RESOURCE_ACCESS_CALENDARS: NO
        ENABLE_RESOURCE_ACCESS_CAMERA: NO
        ENABLE_RESOURCE_ACCESS_CONTACTS: NO
        ENABLE_RESOURCE_ACCESS_LOCATION: NO
        ENABLE_RESOURCE_ACCESS_PRINTING: NO
        ENABLE_RESOURCE_ACCESS_USB: NO
        ENABLE_USER_SELECTED_FILES: readwrite
  MuninnTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - MuninnTests
    dependencies:
      - target: Muninn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MUNINN_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/$(MUNINN_PRODUCT_NAME).app/Contents/MacOS/$(MUNINN_PRODUCT_NAME)
schemes:
  Muninn:
    build:
      targets:
        Muninn: all
    test:
      targets:
        - MuninnTests
    run:
      config: Debug
    archive:
      config: Release
